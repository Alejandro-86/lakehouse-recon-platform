[project]
name = "lakehouse-recon-platform"
version = "0.1.0"
description = "Trino + Iceberg medallion lakehouse with reconciliation controls that fail the run instead of warning"
requires-python = ">=3.11"
dependencies = [
    "trino>=0.329",
    "kafka-python>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
dbt = ["dbt-core>=1.8", "dbt-trino>=1.8"]

[project.scripts]
lakehouse = "lakehouse_recon.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running docker-compose stack (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
